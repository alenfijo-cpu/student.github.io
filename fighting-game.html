<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2D Fighting Game</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:Arial,Helvetica,sans-serif}
    body>*:not(canvas):not(#overlay){display:none}
    canvas{display:block;margin:0 auto;background:#001022; width:1280px; height:720px; border:6px solid #111; box-sizing:border-box}
    #overlay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;background:rgba(6,10,18,0.98);color:#ddd;padding:18px;border-radius:10px;box-shadow:0 6px 30px rgba(0,0,0,0.6);z-index:30}
    .char-list{display:flex;gap:8px;flex-wrap:wrap}
    .char-btn{background:#0b1220;border:1px solid #203040;padding:8px 10px;border-radius:6px;cursor:pointer;color:#fff}
    .char-btn.selected{outline:3px solid #9cf}
  </style>
</head>
<body>
  <div id="overlay">
    <h2>Choose Characters</h2>
    <div style="display:flex;gap:18px">
      <div style="flex:1">
        <div style="font-size:13px;color:#9cf;margin-bottom:6px">Player 1</div>
        <div id="p1chars" class="char-list"></div>
      </div>
      <div style="flex:1">
        <div style="font-size:13px;color:#f99;margin-bottom:6px">Player 2</div>
        <div id="p2chars" class="char-list"></div>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px;color:#bbb">Pick characters for both players then press Start. P1 ult: E, P2 ult: L</div>
      <div>
        <button id="startBtn" class="char-btn" onclick="startGame()">Start Game</button>
      </div>
    </div>
  </div>
  <canvas id="game" width="1280" height="720"></canvas>
<script>
// Lightweight playable fighting prototype with parkour, healing and stronger ults
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
canvas.width = 1280; canvas.height = 720; const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 90, PLAYER_W = 44, PLAYER_H = 72;
const GRAVITY = 1.0, FRICTION = 0.92;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

class Player{
  constructor(x,color,keys){
    this.x=x; this.y=GROUND_Y-PLAYER_H; this.vx=0; this.vy=0; this.color=color; this.facing=1;
    this.onGround=true; this.health=100; this.maxHealth=100; this.attackTimer=0; this.attackHit=false; this.keys=keys; this.anim=0;
    this.ultMeter=0; this.ultReady=false; this.ultCooldown=0;
    this.maxJumps=2; this.jumpsLeft=this.maxJumps; this.coyote=0; this.coyoteTime=8;
    this.dashCooldown=0; this.dashTimer=0; this.lastDamaged=0; this._shield=0; this.stun=0;
    this._prevJump=false; this._prevDash=false; this.attackBoost=1;
  }
  rect(){return {x:this.x,y:this.y,w:PLAYER_W,h:PLAYER_H};}
  takeDamage(amount, source){ if(this._shield){ amount = Math.round(amount*0.5); if(source && source.owner) source.owner.ultMeter = Math.min(100,(source.owner.ultMeter||0)+8); } this.health = Math.max(0,this.health-amount); this.lastDamaged = performance.now(); }
  update(input){ if(this.stun>0){this.stun--; return;} if(this.onGround) this.coyote=this.coyoteTime; else if(this.coyote>0) this.coyote--;
    if(input.left) this.vx-=0.95; if(input.right) this.vx+=0.95;
    if(input.jumpPressed){ if(this.onGround || this.coyote>0){ this.vy=-21; this.onGround=false; this.jumpsLeft=this.maxJumps-1; } else if(this.jumpsLeft>0){ this.vy=-18; this.jumpsLeft--; } }
    if(input.dashPressed && this.dashCooldown<=0){ this.vx+=this.facing*14; this.dashCooldown=42; this.dashTimer=10; }
    if(this.dashCooldown>0) this.dashCooldown--; if(this.dashTimer>0) this.dashTimer--;
    this.vy+=GRAVITY; this.vx*=FRICTION; this.vx=clamp(this.vx,-16,16);
    const prevY=this.y; this.x+=this.vx; this.y+=this.vy; let landed=false;
    for(const p of platforms){ if(prevY+PLAYER_H<=p.y && this.y+PLAYER_H>=p.y && this.x+PLAYER_W>p.x && this.x<p.x+p.w){ this.y=p.y-PLAYER_H; this.vy=0; this.onGround=true; this.jumpsLeft=this.maxJumps; landed=true; break; } }
    if(!landed && this.y+PLAYER_H>=GROUND_Y){ this.y=GROUND_Y-PLAYER_H; this.vy=0; this.onGround=true; this.jumpsLeft=this.maxJumps; landed=true; }
    if(!landed) this.onGround=false;
    this.x=clamp(this.x,8,WORLD_W-PLAYER_W-8);
    if(input.left) this.facing=-1; if(input.right) this.facing=1;
    if(input.attack && this.attackTimer<=0){ this.attackTimer=18; this.attackHit=false; }
    if(this.attackTimer>0) this.attackTimer--;
    if(this.ultCooldown>0) this.ultCooldown--; this.ultReady = this.ultMeter>=100 && this.ultCooldown<=0;
    const now=performance.now(); if(now-(this.lastDamaged||0)>3000 && this.health<this.maxHealth) this.health = Math.min(this.maxHealth,this.health+0.18);
    this.anim++;
  }
  draw(ctx,cameraX){ const sx=Math.round(this.x-cameraX), sy=Math.round(this.y);
    if(this.dashTimer>0){ ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(sx-6,sy,PLAYER_W+12,PLAYER_H); }
    ctx.fillStyle='#ffd6b3'; ctx.beginPath(); ctx.arc(sx+PLAYER_W/2,sy+14,13,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=this.color; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2,sy+28); ctx.lineTo(sx+PLAYER_W/2,sy+48); ctx.stroke();
    const swing=Math.sin(this.anim*0.2)*(Math.abs(this.vx)>0.5?0.9:0.2); ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2-18,sy+36+swing*6); ctx.lineTo(sx+PLAYER_W/2+18,sy+36-swing*6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2,sy+48); ctx.lineTo(sx+PLAYER_W/2-12-swing*6,sy+84); ctx.moveTo(sx+PLAYER_W/2,sy+48); ctx.lineTo(sx+PLAYER_W/2+12+swing*6,sy+84); ctx.stroke();
    this.drawWeapon(ctx,sx,sy);
    ctx.fillStyle='#222'; ctx.fillRect(sx-8,sy-18,PLAYER_W+16,10); ctx.fillStyle='#8ef'; ctx.fillRect(sx-8,sy-18,Math.round((this.health/this.maxHealth)*(PLAYER_W+16)),10);
    ctx.fillStyle='#222'; ctx.fillRect(sx-8,sy-6,PLAYER_W+16,6); ctx.fillStyle=this.ultReady? '#ffd54f':'#8a8'; ctx.fillRect(sx-8,sy-6,Math.round(((this.ultMeter||0)/100)*(PLAYER_W+16)),6);
    if(this._shield){ ctx.strokeStyle='rgba(255,213,79,0.9)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx+PLAYER_W/2,sy+14,18,0,Math.PI*2); ctx.stroke(); }
  }
  drawWeapon(ctx,sx,sy){ const name=this.char&&this.char.name?this.char.name:'Default'; const d=this.facing; if(name==='Blade'||name==='Samurai'){ ctx.strokeStyle=this.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2+(d>0?12:-12),sy+32); ctx.lineTo(sx+PLAYER_W/2+(d>0?44:-44),sy+22); ctx.stroke(); } else if(name==='Spear'){ ctx.strokeStyle=this.color; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2+(d>0?12:-12),sy+36); ctx.lineTo(sx+PLAYER_W/2+(d>0?48:-48),sy+36); ctx.stroke(); ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(sx+PLAYER_W/2+(d>0?50:-50),sy+36,4,0,Math.PI*2); ctx.fill(); } else if(name==='Archer'){ ctx.strokeStyle=this.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2+(d>0?8:-8),sy+28); ctx.lineTo(sx+PLAYER_W/2+(d>0?42:-42),sy+20); ctx.moveTo(sx+PLAYER_W/2+(d>0?42:-42),sy+20); ctx.lineTo(sx+PLAYER_W/2+(d>0?40:-40),sy+28); ctx.stroke(); } else if(name==='Mage'){ ctx.fillStyle=this.color; ctx.globalAlpha=0.8; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(sx+PLAYER_W/2+(d>0?16:-16)+i*8,sy+30+Math.sin(this.anim*0.1+i)*4,3,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; } else if(name==='Brawler'){ ctx.fillStyle=this.color; const fx=sx+PLAYER_W/2+(d>0?24:-24), fy=sy+36; ctx.fillRect(fx-6,fy-8,12,16); } else if(name==='Ninja'){ ctx.strokeStyle=this.color; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2+(d>0?10:-10),sy+28); ctx.lineTo(sx+PLAYER_W/2+(d>0?40:-40),sy+28); ctx.moveTo(sx+PLAYER_W/2+(d>0?40:-40),sy+24); ctx.lineTo(sx+PLAYER_W/2+(d>0?40:-40),sy+32); ctx.stroke(); } else if(name==='Gunner'){ ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(sx+PLAYER_W/2+(d>0?32:-32),sy+32,5,0,Math.PI*2); ctx.fill(); ctx.fillRect(sx+PLAYER_W/2+(d>0?12:-12),sy+30,d>0?20:-20,4); } else if(name==='Shield'){ ctx.fillStyle=this.color; ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(sx+PLAYER_W/2+(d>0?28:-28),sy+32,12,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; } else if(name==='Medic'){ ctx.strokeStyle=this.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(sx+PLAYER_W/2+(d>0?20:-20),sy+24); ctx.lineTo(sx+PLAYER_W/2+(d>0?20:-20),sy+40); ctx.moveTo(sx+PLAYER_W/2+(d>0?12:-12),sy+32); ctx.lineTo(sx+PLAYER_W/2+(d>0?28:-28),sy+32); ctx.stroke(); } else { ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(sx + (d===1?PLAYER_W:-20), sy+30, 28, 18); } }
  drawAttackWeapon(ctx,sx,sy){ this.drawWeapon(ctx,sx,sy); }
}

// world
const WORLD_W = 2600; const stars=[]; function initStars(n=260){ stars.length=0; for(let i=0;i<n;i++) stars.push({x:Math.random()*WORLD_W,y:20+Math.random()*(H-160),z:0.2+Math.random()*0.8,r:Math.random()*2+0.4}); } initStars();
// platforms
const platforms=[ {x:160,y:420,w:240,h:12},{x:520,y:360,w:180,h:12},{x:940,y:420,w:240,h:12},{x:1380,y:380,w:200,h:12},{x:1760,y:420,w:240,h:12} ];
// pickups
const pickups=[]; function spawnPickups(){ pickups.length=0; for(const p of platforms){ if(Math.random()<0.7){ const types=['health','healing','damage','ult']; const t=types[Math.floor(Math.random()*types.length)]; pickups.push({x:p.x+Math.random()*(p.w-18)+8,y:p.y-20,w:16,h:16,type:t,ttl:0}); } } } spawnPickups();

// characters
const CHARACTERS=[ {name:'Blade',color:'#6a0dad'},{name:'Gunner',color:'#0aa'},{name:'Spear',color:'#f45'},{name:'Mage',color:'#3af'},{name:'Shield',color:'#f9a'},{name:'Ninja',color:'#ccc'},{name:'Samurai',color:'#d24'},{name:'Brawler',color:'#d58'},{name:'Archer',color:'#6c3'},{name:'Medic',color:'#5cf'} ];

// players
const p1=new Player(240,CHARACTERS[0].color,{left:'a',right:'d',jump:'w',attack:'f',dash:'Shift'});
const p2=new Player(520,CHARACTERS[1].color,{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',attack:'/',dash:'m'});
let selectedP1=0, selectedP2=1;
function buildCharButtons(){ const p1wrap=document.getElementById('p1chars'), p2wrap=document.getElementById('p2chars'); p1wrap.innerHTML=''; p2wrap.innerHTML=''; CHARACTERS.forEach((c,i)=>{ const b1=document.createElement('button'); b1.className='char-btn'; b1.textContent=c.name; b1.onclick=()=>{ selectedP1=i; updateSelectionUI(); }; const b2=document.createElement('button'); b2.className='char-btn'; b2.textContent=c.name; b2.onclick=()=>{ selectedP2=i; updateSelectionUI(); }; p1wrap.appendChild(b1); p2wrap.appendChild(b2); }); updateSelectionUI(); }
function updateSelectionUI(){ const p1wrap=document.getElementById('p1chars'), p2wrap=document.getElementById('p2chars'); Array.from(p1wrap.children).forEach((el,idx)=>el.classList.toggle('selected', idx===selectedP1)); Array.from(p2wrap.children).forEach((el,idx)=>el.classList.toggle('selected', idx===selectedP2)); }
document.addEventListener('DOMContentLoaded', ()=>{ buildCharButtons(); document.getElementById('startBtn').addEventListener('click', ()=>{ p1.color=CHARACTERS[selectedP1].color; p2.color=CHARACTERS[selectedP2].color; p1.char=CHARACTERS[selectedP1]; p2.char=CHARACTERS[selectedP2]; p1.x=220; p2.x=520; spawnPickups(); document.getElementById('overlay').style.display='none'; }); });
// global start function (also used by inline onclick attribute)
function startGame(){
  p1.color = CHARACTERS[selectedP1].color;
  p2.color = CHARACTERS[selectedP2].color;
  p1.char = CHARACTERS[selectedP1];
  p2.char = CHARACTERS[selectedP2];
  p1.x = 220; p2.x = 520;
  spawnPickups();
  const ov = document.getElementById('overlay'); if(ov) ov.style.display = 'none';
}

// input
const keysDown={}; window.addEventListener('keydown',e=>{ keysDown[e.key]=true; }); window.addEventListener('keyup',e=>{ delete keysDown[e.key]; });
function poll(map){ return { left:!!keysDown[map.left], right:!!keysDown[map.right], jump:!!keysDown[map.jump], attack:!!keysDown[map.attack], dash:!!keysDown[map.dash] }; }

// projectiles & particles
const projectiles=[]; const particles=[];
let screenShake = 0;
function spawnProjectile(x,y,vx,vy,owner,damage,knock,color){ projectiles.push({x,y,vx,vy,life:200,owner,damage,knock,color}); }
function updateProjectiles(){ for(let i=projectiles.length-1;i>=0;i--){ const pr=projectiles[i]; pr.x+=pr.vx; pr.y+=pr.vy; pr.life--; pr.vy+=0.08; if(pr.life<=0){ projectiles.splice(i,1); continue; } [p1,p2].forEach(pl=>{ if(pr.owner!==pl && rectsOverlap(pr,pl.rect())){ if(pl._shield){ pr.vx=-pr.vx*0.8; pr.owner=pl; pr.x+=pr.vx; return; } pl.takeDamage(pr.damage,pr); pl.vx += (pr.vx>0?1:-1)*pr.knock; pl.vy=-4; if(pr.owner) pr.owner.ultMeter = Math.min(100,(pr.owner.ultMeter||0)+14); spawnHit(pl.x+PLAYER_W/2, pl.y+24, pr.color); pr.life=0; } }); if(pr.life<=0) projectiles.splice(i,1);} }
function spawnHit(x,y,color){ for(let i=0;i<10;i++) particles.push({x,y,vx:(Math.random()*6-3),vy:(Math.random()*-4-1),life:30,color}); }
function updateParticles(){ for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life--; if(p.life<=0) particles.splice(i,1); } }

// pickups
function updatePickups(){ for(let i=pickups.length-1;i>=0;i--){ const pk=pickups[i]; pk.ttl++; pk.y += Math.sin(pk.ttl*0.06)*0.2; if(rectsOverlap(pk,p1.rect())){ applyPickup(p1,pk); pickups.splice(i,1); continue; } if(rectsOverlap(pk,p2.rect())){ applyPickup(p2,pk); pickups.splice(i,1); continue; } } }
function applyPickup(pl,pk){ if(pk.type==='health'){ pl.health=Math.min(pl.maxHealth,pl.health+50); } else if(pk.type==='healing'){ pl.health=Math.min(pl.maxHealth,pl.health+25); pl.lastDamaged = performance.now()-2000; } else if(pk.type==='damage'){ pl.attackBoost=1.8; setTimeout(()=>{ pl.attackBoost=1; },3000); } else if(pk.type==='ult'){ pl.ultMeter=Math.min(100,(pl.ultMeter||0)+60); } }

function rectsOverlap(a,b){return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y}

// enhanced ult
function triggerUltimate(actor,target){ const name = actor.char && actor.char.name ? actor.char.name : 'Default';
  if(name==='Blade'||name==='Samurai'){ const dir=actor.facing; actor.vx+=dir*18; actor.ultCooldown=160; actor.ultMeter=0; [p1,p2].forEach(p=>{ if(p!==actor){ const hit={x:actor.x+(dir>0?PLAYER_W:-60),y:actor.y+24,w:80,h:32}; if(rectsOverlap(hit,p.rect())){ p.takeDamage(28,actor); p.vx+=dir*8; p.vy=-6; } } }); spawnHit(actor.x+PLAYER_W/2,actor.y+32,actor.color);
  } else if(name==='Gunner'||name==='Archer'){ actor.ultCooldown=180; actor.ultMeter=0; const dir=actor.facing; for(let i=0;i<7;i++){ const spread=(i-3)*0.12; spawnProjectile(actor.x+PLAYER_W/2,actor.y+30,dir*(8+Math.abs(i-3)*0.6),spread*4,actor,9,6,actor.color); } 
  } else if(name==='Spear'){ actor.ultCooldown=160; actor.ultMeter=0; const dir=actor.facing; spawnProjectile(actor.x+PLAYER_W/2+dir*10,actor.y+28,dir*22,0,actor,34,12,actor.color);
  } else if(name==='Mage'){ actor.ultCooldown=220; actor.ultMeter=0; for(let i=0;i<18;i++){ const a=(i/18)*Math.PI*2; spawnProjectile(actor.x+PLAYER_W/2,actor.y+32,Math.cos(a)*6,Math.sin(a)*2,actor,10,6,actor.color); } 
  } else if(name==='Shield'){ actor._shield=1; setTimeout(()=>{ actor._shield=0; },2600); actor.ultCooldown=200; actor.ultMeter=0; spawnHit(actor.x+PLAYER_W/2,actor.y+32,actor.color);
  } else if(name==='Ninja'){ actor.ultCooldown=180; actor.ultMeter=0; for(let i=0;i<3;i++){ actor.x += actor.facing*120; spawnHit(actor.x+PLAYER_W/2,actor.y+28,actor.color); [p1,p2].forEach(p=>{ if(p!==actor && rectsOverlap(actor.rect(),p.rect())) p.takeDamage(18,actor); }); }
  } else if(name==='Brawler'){ actor.ultCooldown=200; actor.ultMeter=0; for(let i=0;i<10;i++){ const a=(i/10)*Math.PI*2; spawnProjectile(actor.x+PLAYER_W/2,actor.y+48,Math.cos(a)*6,Math.sin(a)*2,actor,12,8,actor.color); }
  } else if(name==='Archer'){ actor.ultCooldown=180; actor.ultMeter=0; for(let i=0;i<12;i++){ spawnProjectile(actor.x + (i-6)*12, actor.y-60, 0, 6 + Math.random()*2, actor, 6, 4, actor.color); } 
  } else if(name==='Medic'){ actor.ultCooldown=240; actor.ultMeter=0; const healTargets=[actor,(actor===p1?p2:p1)]; healTargets.forEach(t=>{ const step=setInterval(()=>{ t.health=Math.min(t.maxHealth,t.health+6); },350); setTimeout(()=>{ clearInterval(step); },2800); });
  } else { spawnProjectile(actor.x+PLAYER_W/2+actor.facing*20,actor.y+28,actor.facing*12,0,actor,32,12,actor.color); actor.ultCooldown=160; actor.ultMeter=0; }
}

// game loop
function gameTick(){ const raw1=poll(p1.keys), raw2=poll(p2.keys); const in1={left:raw1.left,right:raw1.right,jump:raw1.jump,attack:raw1.attack,dash:raw1.dash,jumpPressed:false,dashPressed:false}; const in2={left:raw2.left,right:raw2.right,jump:raw2.jump,attack:raw2.attack,dash:raw2.dash,jumpPressed:false,dashPressed:false}; in1.jumpPressed = raw1.jump && !p1._prevJump; in2.jumpPressed = raw2.jump && !p2._prevJump; p1._prevJump=raw1.jump; p2._prevJump=raw2.jump; in1.dashPressed = raw1.dash && !p1._prevDash; in2.dashPressed = raw2.dash && !p2._prevDash; p1._prevDash=raw1.dash; p2._prevDash=raw2.dash; in1.jump=raw1.jump; in2.jump=raw2.jump;
  p1.update(in1); p2.update(in2);
  // attacks: explicit player checks to avoid invalid objects
  [[p1,p2],[p2,p1]].forEach(([att,def])=>{
    if(!(att instanceof Player)){
      console.warn('Invalid attacker in attack loop (not Player):', att);
      return;
    }
    const h = typeof att.attackHitbox === 'function' ? att.attackHitbox() : null;
    if(h && def && !att.attackHit){
      if(rectsOverlap(h,def.rect())){
        const dmg = Math.round(12*(att.attackBoost||1));
        def.takeDamage(dmg,att);
        def.vx += att.facing*5; def.vy = -6;
        att.attackHit = true; att.ultMeter = Math.min(100,(att.ultMeter||0)+10);
        spawnHit(def.x+PLAYER_W/2,def.y+28,att.color);
        screenShake = Math.max(screenShake, 6);
      }
    }
  });
  updateProjectiles(); updateParticles(); updatePickups(); if(Math.random()<0.0022) spawnPickups(); if(keysDown['e'] && p1.ultReady){ triggerUltimate(p1,p2); keysDown['e']=false; } if(keysDown['l'] && p2.ultReady){ triggerUltimate(p2,p1); keysDown['l']=false; }
  const camCenter = (p1.x + p2.x)/2;
  const cameraX = clamp(camCenter - W/2, 0, Math.max(0, WORLD_W - W));
  const shakeX = (Math.random()*2 - 1) * screenShake;
  render(clamp(cameraX + shakeX, 0, Math.max(0, WORLD_W - W)));
  screenShake *= 0.88;
  requestAnimationFrame(gameTick);
}

function render(cameraX){ ctx.fillStyle='#001022'; ctx.fillRect(0,0,W,H); for(const s of stars){ const par=0.3+s.z*0.65; const sx=(s.x)-cameraX*par; if(sx<-10||sx>W+10) continue; ctx.globalAlpha=0.7*s.z; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; ctx.fillStyle='#071018'; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y); for(const p of platforms){ ctx.fillStyle='#2a2a2a'; ctx.fillRect(p.x-cameraX,p.y,p.w,p.h); ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.strokeRect(p.x-cameraX,p.y,p.w,p.h); } for(const pk of pickups){ const sx=pk.x-cameraX, sy=pk.y; pk.ttl++; if(pk.type==='health'){ ctx.fillStyle='#e44'; ctx.fillRect(sx,sy,pk.w,pk.h); ctx.fillStyle='#fff'; ctx.fillRect(sx+2,sy+2,4,12); ctx.fillRect(sx+10,sy+6,4,4); } else if(pk.type==='healing'){ ctx.fillStyle='#4e4'; ctx.beginPath(); ctx.arc(sx+pk.w/2,sy+pk.h/2,pk.w/2,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='9px Arial'; ctx.textAlign='center'; ctx.fillText('+',sx+pk.w/2,sy+pk.h/2+2); } else if(pk.type==='damage'){ ctx.fillStyle='#fa6'; ctx.beginPath(); ctx.moveTo(sx+pk.w/2,sy); ctx.lineTo(sx+pk.w,sy+pk.h/2); ctx.lineTo(sx+pk.w/2,sy+pk.h); ctx.lineTo(sx,sy+pk.h/2); ctx.fill(); } else if(pk.type==='ult'){ ctx.fillStyle='#ffd54f'; ctx.fillRect(sx,sy,pk.w,pk.h); ctx.fillStyle='#f90'; ctx.font='10px Arial'; ctx.textAlign='center'; ctx.fillText('E',sx+pk.w/2,sy+pk.h/2+2); } } p1.draw(ctx,cameraX); p2.draw(ctx,cameraX); for(const pr of projectiles){ ctx.fillStyle=pr.color||'#fff'; ctx.fillRect(pr.x-cameraX,pr.y,8,8); } for(const pt of particles){ ctx.globalAlpha=pt.life/30; ctx.fillStyle=pt.color; ctx.fillRect(pt.x-cameraX,pt.y,3,3); ctx.globalAlpha=1; } ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.fillText('P1: '+Math.round(p1.health),12,20); ctx.fillText('P2: '+Math.round(p2.health),W-90,20); }

// runtime error handler: paint errors to canvas and log
window.onerror = function(msg, src, line, col, err){
  console.error('Runtime error', msg, src, line, col, err);
  try{
    ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f55'; ctx.font='18px sans-serif'; ctx.fillText('Error: '+(msg||'unknown'),20,40);
    ctx.fillStyle='#fff'; ctx.font='14px monospace'; ctx.fillText((err && err.stack)?err.stack.split('\n')[0]:'',20,68);
  }catch(e){}
  return false;
};

// debug info drawn on canvas each frame for diagnosis
const _origRender = render;
render = function(cameraX){ try{ _origRender(cameraX); ctx.fillStyle='#fff'; ctx.font='12px monospace'; ctx.textAlign='left'; ctx.fillText('p1: '+Math.round(p1.x)+','+Math.round(p1.y)+' '+(p1.char? p1.char.name:'(no char)'),12,42); ctx.fillText('p2: '+Math.round(p2.x)+','+Math.round(p2.y)+' '+(p2.char? p2.char.name:'(no char)'),12,58); }catch(e){ window.onerror(e.message); } };

// capture console warnings for on-canvas display
const __debugLogs = [];
const _origWarn = console.warn.bind(console);
console.warn = function(...args){ __debugLogs.push(args.map(a=>''+a).join(' ')); if(__debugLogs.length>6) __debugLogs.shift(); _origWarn(...args); };

// extend render to show last debug warnings
const __wrapRender = render;
render = function(cameraX){ __wrapRender(cameraX);
  try{
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(10,64,420, (14*(__debugLogs.length+1))+8);
    ctx.fillStyle='#ffb'; ctx.font='12px monospace'; for(let i=0;i<__debugLogs.length;i++){ ctx.fillText(__debugLogs[i], 16, 80 + i*14); }
  }catch(e){}
};

// start
p1.char = CHARACTERS[selectedP1]; p2.char = CHARACTERS[selectedP2]; initStars(); requestAnimationFrame(gameTick);
</script>
</body>
